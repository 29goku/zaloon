<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <rect width="32" height="32" rx="6" fill="#0a0a0a"/>
  <!-- Left blade ring -->
  <circle cx="8" cy="8" r="4" stroke="#F48E16" stroke-width="2" fill="none"/>
  <!-- Right blade ring -->
  <circle cx="24" cy="8" r="4" stroke="#F48E16" stroke-width="2" fill="none"/>
  <!-- Left blade line -->
  <line x1="11" y1="11" x2="20" y2="22" stroke="#F48E16" stroke-width="2" stroke-linecap="round"/>
  <!-- Right blade line -->
  <line x1="21" y1="11" x2="12" y2="22" stroke="#F48E16" stroke-width="2" stroke-linecap="round"/>
  <!-- Pivot -->
  <circle cx="16" cy="16.5" r="1.5" fill="#F48E16"/>
</svg>
